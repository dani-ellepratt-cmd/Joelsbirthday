 function drawDani(dead) {
   // Dani — shorter, olive skin, very long dark brown hair, rust/terracotta top, big smile
   var dx=CW-58, dy=GROUND;
   var bounce = dead ? 0 : Math.sin(frame*0.12)*6;
   var sk='#c47850', hair='#2a1408', hairHi='#4a2210', top='#b85c3a', topDark='#943e22';

   // ground shadow
   ctx.fillStyle='rgba(0,0,0,0.1)';
   ctx.beginPath(); ctx.ellipse(dx,GROUND+3,11,3,0,0,Math.PI*2); ctx.fill();

   // ── LEGS — bare skin (shorter than Joel) ──
   ctx.strokeStyle=sk; ctx.lineWidth=5; ctx.lineCap='round';
   ctx.beginPath(); ctx.moveTo(dx-4,dy-8); ctx.lineTo(dx-5,dy+8); ctx.stroke();
   ctx.beginPath(); ctx.moveTo(dx+4,dy-8); ctx.lineTo(dx+5,dy+8); ctx.stroke();
   // gold sandals
   ctx.fillStyle='#c8a96e';
   ctx.beginPath(); ctx.ellipse(dx-5,dy+9,7,3,0,0,Math.PI*2); ctx.fill();
   ctx.beginPath(); ctx.ellipse(dx+5,dy+9,7,3,0,0,Math.PI*2); ctx.fill();
   ctx.strokeStyle='#9a7040'; ctx.lineWidth=1;
   ctx.beginPath(); ctx.ellipse(dx-5,dy+9,7,3,0,0,Math.PI*2); ctx.stroke();
   ctx.beginPath(); ctx.ellipse(dx+5,dy+9,7,3,0,0,Math.PI*2); ctx.stroke();

   // ── RUST/TERRACOTTA TOP (spaghetti strap — from photo) ──
   ctx.fillStyle=top;
   ctx.beginPath();
   ctx.moveTo(dx-11,dy-10); ctx.lineTo(dx+11,dy-10);
   ctx.lineTo(dx+9,dy-36); ctx.lineTo(dx-9,dy-36); ctx.closePath(); ctx.fill();
   ctx.fillStyle=topDark; ctx.fillRect(dx+6,dy-36,3,26);
   // spaghetti straps
   ctx.strokeStyle=top; ctx.lineWidth=2.5; ctx.lineCap='round';
   ctx.beginPath(); ctx.moveTo(dx-7,dy-36); ctx.lineTo(dx-5,dy-44); ctx.stroke();
   ctx.beginPath(); ctx.moveTo(dx+7,dy-36); ctx.lineTo(dx+5,dy-44); ctx.stroke();

   // ── ARMS ──
   var armY = dead ? -4 : -16+bounce;
   ctx.strokeStyle=sk; ctx.lineWidth=4; ctx.lineCap='round';
   ctx.beginPath(); ctx.moveTo(dx-9,dy-30); ctx.lineTo(dx-19,dy+armY); ctx.stroke();
   ctx.beginPath(); ctx.moveTo(dx+9,dy-30); ctx.lineTo(dx+19,dy+armY); ctx.stroke();
   // gold pom poms
   if (!dead) {
     for (var pi=0;pi<7;pi++){
       var pa=(pi/7)*Math.PI*2;
       ctx.fillStyle= pi%2===0 ? '#FFD700' : '#C8A96E';
       ctx.beginPath(); ctx.arc(dx-19+Math.cos(pa)*5.5,dy+armY+Math.sin(pa)*5.5,2.5,0,Math.PI*2); ctx.fill();
       ctx.beginPath(); ctx.arc(dx+19+Math.cos(pa)*5.5,dy+armY+Math.sin(pa)*5.5,2.5,0,Math.PI*2); ctx.fill();
     }
   }

   // ── LONG DARK HAIR behind body ──
   ctx.fillStyle=hair;
   ctx.beginPath(); ctx.moveTo(dx-10,dy-54);
   ctx.bezierCurveTo(dx-22,dy-38,dx-20,dy-18,dx-22,dy-2);
   ctx.lineTo(dx-16,dy-2);
   ctx.bezierCurveTo(dx-14,dy-18,dx-16,dy-38,dx-8,dy-54);
   ctx.closePath(); ctx.fill();
   ctx.beginPath(); ctx.moveTo(dx+8,dy-54);
   ctx.bezierCurveTo(dx+18,dy-36,dx+16,dy-16,dx+18,dy);
   ctx.lineTo(dx+12,dy);
   ctx.bezierCurveTo(dx+10,dy-16,dx+12,dy-36,dx+6,dy-54);
   ctx.closePath(); ctx.fill();

   // ── HEAD ──
   ctx.fillStyle=sk;
   ctx.beginPath(); ctx.ellipse(dx,dy-50,11,13,0,0,Math.PI*2); ctx.fill();

   // ── HAIR cap + front strands ──
   ctx.fillStyle=hair; ctx.beginPath(); ctx.ellipse(dx,dy-56,11,9,0,Math.PI,0); ctx.fill();
   ctx.fillStyle=hair;
   ctx.beginPath(); ctx.arc(dx-10,dy-52,4,Math.PI*0.5,Math.PI*1.5); ctx.fill();
   ctx.beginPath(); ctx.arc(dx+10,dy-52,4,-Math.PI*0.5,Math.PI*0.5); ctx.fill();
   ctx.strokeStyle=hairHi; ctx.lineWidth=1; ctx.lineCap='round';
   ctx.beginPath(); ctx.moveTo(dx,dy-62); ctx.lineTo(dx,dy-57); ctx.stroke();
   // Left shoulder strands
   ctx.strokeStyle=hair; ctx.lineWidth=7; ctx.lineCap='round';
   ctx.beginPath(); ctx.moveTo(dx-9,dy-55);
   ctx.bezierCurveTo(dx-18,dy-40,dx-14,dy-24,dx-18,dy-8); ctx.stroke();
   ctx.lineWidth=5;
   ctx.beginPath(); ctx.moveTo(dx-7,dy-56);
   ctx.bezierCurveTo(dx-15,dy-38,dx-10,dy-22,dx-14,dy-6); ctx.stroke();
   ctx.strokeStyle=hairHi; ctx.lineWidth=2;
   ctx.beginPath(); ctx.moveTo(dx-6,dy-56);
   ctx.bezierCurveTo(dx-12,dy-38,dx-8,dy-22,dx-11,dy-8); ctx.stroke();
   // Right side strands
   ctx.strokeStyle=hair; ctx.lineWidth=6; ctx.lineCap='round';
   ctx.beginPath(); ctx.moveTo(dx+9,dy-55);
   ctx.bezierCurveTo(dx+16,dy-38,dx+13,dy-20,dx+15,dy-5); ctx.stroke();
   ctx.lineWidth=4;
   ctx.beginPath(); ctx.moveTo(dx+7,dy-56);
   ctx.bezierCurveTo(dx+14,dy-36,dx+11,dy-18,dx+13,dy-3); ctx.stroke();

   // ── FACE ──
   if (dead) {
     ctx.strokeStyle='rgba(0,0,0,0.65)'; ctx.lineWidth=1.8;
     [[dx-4,dy-51],[dx+4,dy-51]].forEach(function(ep){
       ctx.beginPath(); ctx.moveTo(ep[0]-2.5,ep[1]-2); ctx.lineTo(ep[0]+2.5,ep[1]+2); ctx.stroke();
       ctx.beginPath(); ctx.moveTo(ep[0]+2.5,ep[1]-2); ctx.lineTo(ep[0]-2.5,ep[1]+2); ctx.stroke();
     });
     ctx.strokeStyle='#7a2010'; ctx.lineWidth=1.5;
     ctx.beginPath(); ctx.arc(dx,dy-43,4,Math.PI+0.3,-0.3); ctx.stroke();
   } else {
     // eyebrows
     ctx.strokeStyle=hair; ctx.lineWidth=1.8; ctx.lineCap='round';
     ctx.beginPath(); ctx.moveTo(dx-7,dy-55); ctx.quadraticCurveTo(dx-4,dy-57,dx-1,dy-55); ctx.stroke();
     ctx.beginPath(); ctx.moveTo(dx+1,dy-55); ctx.quadraticCurveTo(dx+4,dy-57,dx+7,dy-55); ctx.stroke();
     // eye whites
     ctx.fillStyle='white';
     ctx.beginPath(); ctx.ellipse(dx-4,dy-52,3,2,0,0,Math.PI*2); ctx.fill();
     ctx.beginPath(); ctx.ellipse(dx+4,dy-52,3,2,0,0,Math.PI*2); ctx.fill();
     // irises
     ctx.fillStyle='#3d1a08';
     ctx.beginPath(); ctx.arc(dx-4,dy-52,1.8,0,Math.PI*2); ctx.fill();
     ctx.beginPath(); ctx.arc(dx+4,dy-52,1.8,0,Math.PI*2); ctx.fill();
     ctx.fillStyle='#060200';
     ctx.beginPath(); ctx.arc(dx-4,dy-52,0.9,0,Math.PI*2); ctx.fill();
     ctx.beginPath(); ctx.arc(dx+4,dy-52,0.9,0,Math.PI*2); ctx.fill();
     ctx.fillStyle='rgba(255,255,255,0.9)';
     ctx.beginPath(); ctx.arc(dx-3.2,dy-52.7,0.7,0,Math.PI*2); ctx.fill();
     ctx.beginPath(); ctx.arc(dx+4.8,dy-52.7,0.7,0,Math.PI*2); ctx.fill();
     // nose
     ctx.strokeStyle='rgba(140,70,30,0.35)'; ctx.lineWidth=1.2;
     ctx.beginPath(); ctx.moveTo(dx,dy-50); ctx.lineTo(dx-1,dy-47); ctx.stroke();
     // big bright smile
     ctx.fillStyle='#c8504a';
     ctx.beginPath(); ctx.arc(dx,dy-44,4.5,0.1,Math.PI-0.1); ctx.fill();
     ctx.fillStyle='white';
     ctx.beginPath(); ctx.arc(dx,dy-44,3.5,0.3,Math.PI-0.3); ctx.fill();
     // dimple hints
     ctx.strokeStyle='rgba(180,90,50,0.4)'; ctx.lineWidth=1;
     ctx.beginPath(); ctx.arc(dx-6,dy-44,1.5,0,Math.PI*2); ctx.stroke();
     ctx.beginPath(); ctx.arc(dx+6,dy-44,1.5,0,Math.PI*2); ctx.stroke();
     // necklace (she has one in the photo)
     ctx.strokeStyle='#C8A96E'; ctx.lineWidth=1;
     ctx.beginPath(); ctx.arc(dx,dy-40,5,Math.PI+0.4,-0.4); ctx.stroke();
   }

   // ── SPEECH BUBBLE ──
   var sw = Math.max(68, speechText.length*6.5+16), bh=26;
   var bx=dx-sw-16, by=dy-96;
   ctx.fillStyle='rgba(255,255,255,0.95)';
   rr(bx,by,sw,bh,7); ctx.fill();
   ctx.beginPath(); ctx.moveTo(dx-16,by+bh); ctx.lineTo(dx-11,by+bh+11); ctx.lineTo(dx-27,by+bh); ctx.fill();
   ctx.fillStyle='#222'; ctx.font='bold 9.5px Inter'; ctx.textAlign='center';
   ctx.fillText(speechText, bx+sw/2, by+17);
 }

 function drawBG() {
   var g=ctx.createLinearGradient(0,0,0,GROUND);
   g.addColorStop(0,'#e8dcc8'); g.addColorStop(1,'#f2e8d8');
   ctx.fillStyle=g; ctx.fillRect(0,0,CW,CH);
   // clouds
   ctx.fillStyle='rgba(255,255,255,0.55)';
   [[55,38,28],[155,24,20],[268,32,17]].forEach(function(c){
     var ox = ((groundX*0.06)+c[0])%380;
     ctx.beginPath(); ctx.ellipse(ox,c[1],c[2],c[2]*0.55,0,0,Math.PI*2); ctx.fill();
   });
   // ground
   ctx.fillStyle='#c8a96e'; ctx.fillRect(0,GROUND,CW,CH-GROUND);
   ctx.fillStyle='#9a7040'; ctx.fillRect(0,GROUND,CW,4);
   ctx.fillStyle='rgba(255,255,255,0.22)';
   for (var gx=(groundX%50)-50; gx<CW; gx+=50){
     ctx.fillRect(gx,GROUND+12,24,3);
   }
 }

 function drawHUD() {
   ctx.fillStyle='rgba(0,0,0,0.28)'; rr(8,8,95,24,12); ctx.fill();
   ctx.fillStyle='white'; ctx.font='bold 12px Inter'; ctx.textAlign='left';
   ctx.fillText('Score: '+score, 16, 24);
   document.getElementById('gd-score').textContent = 'Score: '+score;
 }

 var obstTypes=[
   {e:'🏀',h:28,oy:0},{e:'🎂',h:30,oy:0},{e:'🍷',h:26,oy:0},
   {e:'🎸',h:30,oy:0},{e:'🎁',h:28,oy:0},{e:'🎈',h:24,oy:-44}
 ];
 function spawnObst() {
   var t=obstTypes[Math.floor(Math.random()*obstTypes.length)];
   obstacles.push({x:CW+24,y:GROUND-t.h/2+t.oy-2,emoji:t.e,size:t.h});
 }

 function loop() {
   ctx.clearRect(0,0,CW,CH);
   drawBG();
   if (gs==='idle') {
     drawJoel(joel.x,GROUND,0,false);
     drawDani(false);
     ctx.fillStyle='#C8A96E'; ctx.font='bold 20px "Cormorant Garamond",serif'; ctx.textAlign='center';
     ctx.fillText('Birthday Dash! 🕹️', CW/2, 50);
     ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.font='13px Inter';
     ctx.fillText('Tap to start — dodge everything!', CW/2, 74);
     ctx.fillStyle='rgba(0,0,0,0.32)'; ctx.font='11px Inter';
     ctx.fillText('Double-tap for double jump', CW/2, 94);
   } else if (gs==='playing') {
     frame++; groundX-=spd; score=Math.floor(frame/8);
     joel.vy+=0.72; joel.y+=joel.vy;
     if (joel.y>=GROUND){joel.y=GROUND;joel.vy=0;joel.jumps=0;}
     if (joel.y<GROUND){joel.lf=joel.lf;}else{joel.lf++;}
     if (frame%420===0 && spd<10) spd+=0.5;
     obstTimer++;
     if (obstTimer>obstInterval){ obstTimer=0; obstInterval=52+Math.random()*72; spawnObst(); }
     for (var i=obstacles.length-1;i>=0;i--){
       obstacles[i].x-=spd;
       if (Math.abs(joel.x-obstacles[i].x)<17 && Math.abs(joel.y-obstacles[i].y)<22){
         gs='dead';
         if (score>best){best=score;localStorage.setItem('jdashBest',best);newBest=true;speechText='NEW RECORD! 🏆🤍';}
         else{newBest=false;speechText='Get up babe! 💪';}
       }
       if (obstacles[i].x<-40){obstacles.splice(i,1);continue;}
       ctx.font=obstacles[i].size+'px serif'; ctx.textAlign='center';
       ctx.fillText(obstacles[i].emoji,obstacles[i].x,obstacles[i].y);
     }
     speechTimer++;
     if (speechTimer>110){speechTimer=0;
       var ph=['Go Joel! 🤍','Jump! 🤍','You got this! 🏃','Woooo! 🎊','Keep going! 💨','Dodge it! 😱'];
       speechText=ph[Math.floor(Math.random()*ph.length)];
     }
     drawJoel(joel.x,joel.y,joel.lf,false);
     drawDani(false);
     drawHUD();
   } else if (gs==='dead') {
     for (var j=0;j<obstacles.length;j++){
       ctx.font=obstacles[j].size+'px serif'; ctx.textAlign='center';
       ctx.fillText(obstacles[j].emoji,obstacles[j].x,obstacles[j].y);
     }
     drawJoel(joel.x,joel.y,0,true);
     drawDani(true);
     ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(0,0,CW,CH);
     ctx.fillStyle='white'; ctx.font='bold 22px "Cormorant Garamond",serif'; ctx.textAlign='center';
     ctx.fillText('Game Over! 😅', CW/2, CH/2-36);
     ctx.font='bold 14px Inter';
     ctx.fillText('Score: '+score, CW/2, CH/2-10);
     if (newBest){
       ctx.fillStyle='#FFD700'; ctx.font='bold 14px Inter';
       ctx.fillText('🏆 New Best: '+best+'!', CW/2, CH/2+14);
       document.getElementById('gd-best').textContent='Best: '+best;
     }
     ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.font='12px Inter';
     ctx.fillText('Tap to try again', CW/2, CH/2+46);
   }
   raf=requestAnimationFrame(loop);
 }

 function handleInput() {
   if (gs==='idle'){
     gs='playing';frame=0;score=0;spd=4;obstacles=[];obstTimer=0;speechText='Go Joel! 🤍';
   } else if (gs==='playing'){
     if (joel.jumps<2){joel.vy=-14;joel.jumps++;}
   } else if (gs==='dead'){
     gs='playing';frame=0;score=0;spd=4;joel.y=GROUND;joel.vy=0;joel.jumps=0;obstacles=[];obstTimer=0;newBest=false;speechText='Go Joel! 🤍';
   }
 }
 canvas.addEventListener('click', handleInput);
 canvas.addEventListener('touchstart', function(e){e.preventDefault();handleInput();},{passive:false});

 var _origClose=window.closeModal;
 window.closeModal=function(){
   cancelAnimationFrame(raf);
   canvas.removeEventListener('click',handleInput);
   window.closeModal=_origClose; _origClose();
 };
 loop();
}

// ── HOUR-BASED BACKGROUND SYSTEM ──────────────────────────────────────
var _origBalloonHTML = '';
var _lastBgHour = -1;

// Config: emoji + animation type per hour
var _hourBgConfig = {
  9:  null, // original balloons
  10: { emoji:'🎡', type:'spin',   count:7 },
  11: { emoji:'💰', type:'float',  count:8 },
  12: { emoji:'🎉', type:'float',  count:7 },
  13: { emoji:'🤲', type:'float',  count:6 },
  14: { emoji:'💸', type:'float',  count:8 },
  15: { emoji:'🏀', type:'bounce', count:9 },
  16: { emoji:'🎱', type:'float',  count:7 },
  17: { emoji:'🎁', type:'float',  count:7 },
  18: { emoji:'🎸', type:'float',  count:6 },
  19: { emoji:'🤲', type:'float',  count:6 },
  20: { emoji:'🍰', type:'float',  count:7 },
  21: { emoji:'🤍', type:'float',  count:8 },
  22: null
};

// Varied positions, durations and delays for natural spread
var _bgLeftPos  = [5,  14, 22, 32, 42, 52, 62, 72, 83];
var _bgDurs     = [13, 10, 16, 11, 14, 9,  15, 12, 17];
var _bgDelays   = [0,   5,  9,  2,  7, 11,  1,  6,  3];

function setHourBackground(hour) {
  if (hour === _lastBgHour) return;
  _lastBgHour = hour;
  var layer = document.getElementById('balloon-layer');
  if (!layer) return;

  var cfg = _hourBgConfig[hour];

  // Hour 9 (or no config): restore original balloons
  if (!cfg) {
    layer.innerHTML = _origBalloonHTML;
    return;
  }

  var html = '';
  var count = cfg.count;

  if (cfg.type === 'bounce') {
    // Basketballs: small, bouncing from positions across both sides of screen
    for (var i = 0; i < count; i++) {
      var left = _bgLeftPos[i % _bgLeftPos.length];
      var dur  = (_bgDurs[i % _bgDurs.length] * 0.45 + 0.5).toFixed(1);
      var del  = (_bgDelays[i % _bgDelays.length] * -0.8).toFixed(1);
      html += '<span class="bg-ball" style="left:' + left + '%;animation-duration:' + dur + 's;animation-delay:' + del + 's">' + cfg.emoji + '</span>';
    }
  } else if (cfg.type === 'spin') {
    // Spin wheel: rotate while floating up
    for (var i = 0; i < count; i++) {
      var left = _bgLeftPos[i % _bgLeftPos.length];
      var dur  = _bgDurs[i % _bgDurs.length];
      var del  = _bgDelays[i % _bgDelays.length];
      html += '<span class="bg-emoji-spin" style="left:' + left + '%;animation-duration:' + dur + 's;animation-delay:' + del + 's">' + cfg.emoji + '</span>';
    }
  } else {
    // Default: gentle float up (same rhythm as balloons)
    for (var i = 0; i < count; i++) {
      var left = _bgLeftPos[i % _bgLeftPos.length];
      var dur  = _bgDurs[i % _bgDurs.length];
      var del  = _bgDelays[i % _bgDelays.length];
      html += '<span class="bg-emoji" style="left:' + left + '%;animation-duration:' + dur + 's;animation-delay:' + del + 's">' + cfg.emoji + '</span>';
    }
  }

  layer.innerHTML = html;
}

// Capture original balloon HTML once DOM is ready, then set background for current hour
(function initHourBg() {
  function applyBg() {
    var layer = document.getElementById('balloon-layer');
    if (!layer) return;
    if (!_origBalloonHTML) _origBalloonHTML = layer.innerHTML;
    _lastBgHour = -1; // always force re-render on explicit call
    setHourBackground(new Date().getHours());
  }
  // Run immediately
  applyBg();
  // Run again once page is fully loaded (catches mobile edge cases)
  window.addEventListener('load', applyBg);
  // Re-check every 10 seconds so hour changes are caught quickly
  setInterval(function() { setHourBackground(new Date().getHours()); }, 10000);
  // Update immediately whenever the user returns to the tab / unlocks phone
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden) { applyBg(); }
  });
})();

</script>
